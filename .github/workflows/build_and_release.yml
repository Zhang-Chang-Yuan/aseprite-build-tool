# =============================================================================
# Aseprite 自动构建与发布工作流
#
# 功能：
#   1. workflow_dispatch 手动触发：可指定 Aseprite 版本 tag（留空构建最新稳定版）
#      与平台；也可勾选 build_all 一次性补齐所有缺失的「版本×平台」组合
#      （等同定时任务逻辑）。
#   2. schedule 定时触发：每天 UTC 2:00 检查 aseprite/aseprite 官方新稳定 tag，
#      与本仓库已有 Release（含草稿）对比，自动构建缺失的「版本×平台」组合。
#
# 版本范围：仅构建 v1.3.14 及之后的版本。
#   原因：只有这些版本的官方 laf 子模块固定使用 aseprite/skia 提供的
#   m124 预编译 Skia（三平台包齐全）；更早版本依赖的旧版 Skia 没有预编译包，
#   v1.1 及以前甚至没有 Skia 后端，无法在 CI 上构建。
#
# 发布策略（并发安全）：
#   - 目标 Release 为 Draft（草稿，仅仓库所有者可见，规避 EULA 公开分发限制）；
#   - 已存在的草稿不会被删除，产物以 --clobber 方式覆盖上传（始终为最新构建），
#     因此同一版本的三个平台任务可以安全并发；
#   - 仅当同名 Release 已被发布为正式版（非草稿）时，先删除再重建为草稿。
# =============================================================================

name: Build and Release Aseprite

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      aseprite_version:
        description: 'Aseprite 版本 tag（仅 v1.3.14+，如 v1.3.18.3；留空构建最新稳定版）'
        required: false
        default: ''
        type: string
      platform:
        description: '构建平台'
        required: false
        type: choice
        default: 'windows-latest'
        options:
          - windows-latest
          - macos-latest
          - ubuntu-latest
      build_all:
        description: '补齐全部缺失的版本×平台组合（等同定时任务逻辑）'
        required: false
        default: false
        type: boolean
  # 每天定时检查新版本
  schedule:
    # 每天 UTC 2:00（北京时间 10:00）
    # 注意：定时功能验证期间临时改为 UTC 5:30，验证完成后恢复为 '0 2 * * *'
    - cron: '30 5 * * *'

# 同一事件类型的运行排队执行，不取消进行中的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # v1.3.14+ 的 aseprite 官方固定使用的 Skia 预编译版本（laf/misc/skia-tag.txt）
  SKIA_TAG: m124-08a5439a6b
  # 只构建此版本及之后的稳定版（旧版本缺少可用的预编译 Skia，无法构建）
  MIN_VERSION: v1.3.14

jobs:
  # ---------------------------------------------------------------------------
  # Job 1：计算要构建的「版本×平台」组合（所有事件都会运行）
  #  - 手动单发（未勾选 build_all）：单个组合，版本取输入（空则由构建步骤解析
  #    为最新稳定版），平台取输入；
  #  - schedule 或 build_all：对比 aseprite/aseprite 官方 tags 与本仓库已有
  #    releases（含 draft），输出全部缺失组合。
  # 输出 JSON 数组：[ {"version":"v1.3.14","platform":"windows-latest"}, ... ]
  # ---------------------------------------------------------------------------
  check-and-trigger:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    outputs:
      combos: ${{ steps.check.outputs.combos }}
    steps:
      - name: 计算构建组合
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BUILD_ALL: ${{ inputs.build_all }}
          INPUT_VERSION: ${{ inputs.aseprite_version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          # ---- 仅处理 schedule 与 workflow_dispatch 事件 ----
          if [ "$EVENT" != "schedule" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "事件 ${EVENT} 不触发构建"
            echo "combos=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- 0. 手动单发模式：直接输出输入的组合 ----
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$BUILD_ALL" != "true" ]; then
            echo "手动单发模式：version=${INPUT_VERSION:-<latest>} platform=${INPUT_PLATFORM}"
            combos="[{\"version\":\"${INPUT_VERSION}\",\"platform\":\"${INPUT_PLATFORM}\"}]"
            echo "combos=${combos}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- 1. 获取本仓库全部 releases（含 draft），汇总各 tag 已有产物后缀 ----
          # 平台产物命名：-windows-x64.zip / -macos-arm64.zip / -linux-x64.tar.gz
          rel_file="$(mktemp)"
          page=1
          while :; do
            resp=$(curl -sSf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")
            count=$(echo "$resp" | jq -r 'length')
            if [ "$count" -eq 0 ]; then break; fi
            echo "$resp" | jq -c '.[] | {tag: .tag_name, assets: [.assets[].name]}' >> "$rel_file"
            page=$((page + 1))
          done

          has_asset() {  # has_asset <tag> <suffix>
            grep -F "\"tag\":\"$1\"" "$rel_file" 2>/dev/null \
              | jq -r --arg s "$2" '.assets[]? | select(endswith($s))' 2>/dev/null | grep -q .
          }

          # ---- 2. 获取 aseprite/aseprite 官方 tags（分页拉取）----
          official_tags_file="$(mktemp)"
          page=1
          while :; do
            resp=$(curl -sSf \
              "https://api.github.com/repos/aseprite/aseprite/tags?per_page=100&page=${page}")
            count=$(echo "$resp" | jq -r 'length')
            if [ "$count" -eq 0 ]; then break; fi
            echo "$resp" | jq -r '.[].name' >> "$official_tags_file"
            page=$((page + 1))
            if [ "$page" -gt 10 ]; then break; fi   # 安全上限
          done

          # ---- 3. 过滤：仅保留 vX.Y.Z(.N) 格式且 >= MIN_VERSION 的稳定 tag ----
          # （旧版本缺少可用的预编译 Skia，无法在 CI 上构建，详见 README）
          stable_file="$(mktemp)"
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' "$official_tags_file" | while read -r tag; do
            if [ "$(printf '%s\n%s\n' "${MIN_VERSION}" "$tag" | sort -V | head -n 1)" = "${MIN_VERSION}" ]; then
              echo "$tag"
            fi
          done | sort -rV > "$stable_file" || true
          echo "目标范围内的官方版本（>= ${MIN_VERSION}）："
          cat "$stable_file" || true
          echo "本仓库已有 releases："
          cat "$rel_file" || true

          # ---- 4. 按「版本×平台」计算缺失组合 ----
          combos_json="["
          first=1
          while read -r tag; do
            [ -z "$tag" ] && continue
            for plat in windows-latest macos-latest ubuntu-latest; do
              case "$plat" in
                windows-latest) suffix="-windows-x64.zip" ;;
                macos-latest)   suffix="-macos-arm64.zip" ;;
                ubuntu-latest)  suffix="-linux-x64.tar.gz" ;;
              esac
              if ! has_asset "$tag" "$suffix"; then
                echo "缺失：${tag} × ${plat}"
                if [ $first -eq 1 ]; then first=0; else combos_json="${combos_json},"; fi
                combos_json="${combos_json}{\"version\":\"${tag}\",\"platform\":\"${plat}\"}"
              fi
            done
          done < "$stable_file"
          combos_json="${combos_json}]"

          echo "combos=${combos_json}" >> "$GITHUB_OUTPUT"
          echo "最终输出：${combos_json}"

  # ---------------------------------------------------------------------------
  # Job 2：构建矩阵
  #  - workflow_dispatch（未勾选 build_all）：单个「版本×平台」组合。
  #  - schedule 或 build_all：全部缺失的「版本×平台」组合。
  # ---------------------------------------------------------------------------
  build:
    needs: check-and-trigger
    if: >-
      always() &&
      needs.check-and-trigger.result == 'success' &&
      needs.check-and-trigger.outputs.combos != '' &&
      needs.check-and-trigger.outputs.combos != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-and-trigger.outputs.combos) }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析要构建的版本号
        id: resolve
        env:
          INPUT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION}"
          # 输入为空或 'latest' 时，通过 API 获取 aseprite/aseprite 最新 release 的 tag_name
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            VERSION=$(curl -sSf https://api.github.com/repos/aseprite/aseprite/releases/latest \
              | jq -r '.tag_name')
            echo "输入为空/latest，使用官方最新 release：${VERSION}"
          fi
          # 仅支持稳定版本，拒绝 alpha/beta/rc/dev/SNAPSHOT 等预发布 tag
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "不支持的版本格式：${VERSION}（仅支持 vX.Y.Z 或 vX.Y.Z.N 的稳定版本）"
            exit 1
          fi
          # 仅支持 MIN_VERSION 及以上（旧版本缺少可用的预编译 Skia，详见 README）
          if [ "$(printf '%s\n%s\n' "${MIN_VERSION}" "$VERSION" | sort -V | head -n 1)" != "${MIN_VERSION}" ]; then
            echo "不支持的版本：${VERSION}（本仓库仅构建 ${MIN_VERSION} 及以上版本，原因见 README）"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "最终构建版本：${VERSION}"

      # -----------------------------------------------------------------
      # 安装依赖（runner 自带 cmake；仅补充 ninja 与 Linux X11 头文件）
      # -----------------------------------------------------------------
      - name: 安装依赖
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$RUNNER_PLATFORM" in
            windows-latest)
              # windows-latest 自带 cmake，确保 ninja 存在
              cmake --version >/dev/null
              ninja --version || choco install ninja -y --no-progress
              ;;
            macos-latest)
              # macOS 自带 cmake，安装 ninja
              cmake --version >/dev/null
              brew install ninja
              ;;
            ubuntu-latest)
              # Ubuntu：cmake 自带，安装 ninja 与 X11/OpenGL 开发头文件
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                ninja-build libx11-dev libxcursor-dev libxi-dev \
                libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
              cmake --version >/dev/null
              ninja --version
              ;;
            *)
              echo "未知平台：${RUNNER_PLATFORM}"
              exit 1
              ;;
          esac

      # -----------------------------------------------------------------
      # Windows：配置 MSVC 编译环境（Ninja 生成器需要 cl.exe 在 PATH 中）
      # -----------------------------------------------------------------
      - name: 配置 MSVC 环境 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # -----------------------------------------------------------------
      # 克隆 Aseprite 源码（指定 tag，递归子模块，浅克隆）
      # -----------------------------------------------------------------
      - name: 克隆 Aseprite 源码
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git clone --recursive --branch "$VERSION" --depth 1 \
            https://github.com/aseprite/aseprite.git

      # -----------------------------------------------------------------
      # 下载 Skia（aseprite/skia 官方预编译包；v1.3.14+ 使用 m124）
      # -----------------------------------------------------------------
      - name: 下载 Skia
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$RUNNER_PLATFORM" in
            windows-latest) SKIA_ZIP="Skia-Windows-Release-x64.zip" ;;
            macos-latest)   SKIA_ZIP="Skia-macOS-Release-arm64.zip" ;;
            ubuntu-latest)  SKIA_ZIP="Skia-Linux-Release-x64.zip" ;;
          esac
          curl -sSfL -o "$SKIA_ZIP" \
            "https://github.com/aseprite/skia/releases/download/${SKIA_TAG}/${SKIA_ZIP}"
          mkdir -p skia
          # Windows 的 Git Bash 不一定有 unzip，使用 7z；其余平台用 unzip
          if [ "$RUNNER_PLATFORM" = "windows-latest" ]; then
            7z x -y -oskia "$SKIA_ZIP" > /dev/null
          else
            unzip -q "$SKIA_ZIP" -d skia
          fi
          rm -f "$SKIA_ZIP"
          echo "Skia 已解压到 skia/ 目录："
          ls skia

      # -----------------------------------------------------------------
      # CMake 配置 + 编译
      # -----------------------------------------------------------------
      - name: 配置 CMake
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          # 先在 skia 目录下查找 skia 库文件（Linux/macOS 为 libskia.a，Windows 为 skia.lib）
          SKIA_LIB=$(find ../skia \( -iname 'libskia.a' -o -iname 'skia.lib' \) | head -n 1)
          if [ -z "$SKIA_LIB" ]; then
            echo "未在 ../skia 下找到 skia 库文件"
            ls -R ../skia || true
            exit 1
          fi
          echo "找到 Skia 库文件：${SKIA_LIB}"
          SKIA_LIB_ABS=$(cd "$(dirname "$SKIA_LIB")" && pwd)/$(basename "$SKIA_LIB")
          # SKIA_DIR 必须用绝对路径，否则 aseprite 的 CMake 会生成相对的
          # INTERFACE_INCLUDE_DIRECTORIES 而报错
          SKIA_DIR_ABS=$(cd ../skia && pwd)
          cmake ../aseprite \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="${SKIA_DIR_ABS}" \
            -DSKIA_LIBRARY_DIR="$(dirname "$SKIA_LIB_ABS")" \
            -DSKIA_LIBRARY="${SKIA_LIB_ABS}"

      - name: 编译 Aseprite
        run: |
          set -euo pipefail
          cd build
          ninja aseprite
          # 确保 bin/data 资源目录已复制（个别版本 copy_data 是独立目标）
          ninja copy_data || echo "copy_data 目标不存在，跳过"

      # -----------------------------------------------------------------
      # 打包产物
      # -----------------------------------------------------------------
      - name: 打包
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd build
          case "$RUNNER_PLATFORM" in
            windows-latest)
              # 收集 exe 依赖的非系统 DLL（主要是 OpenSSL 的
              # libcrypto-3-x64.dll / libssl-3-x64.dll），否则解压后无法运行
              ldd ./bin/aseprite.exe 2>/dev/null | awk '{print $1" "$3}' | while read -r name path; do
                [ -n "$path" ] || continue
                case "$path" in
                  /c/Windows/*|/mnt/*) continue ;;
                esac
                if [ -f "$path" ] && [ ! -f "./bin/$name" ]; then
                  cp "$path" ./bin/ && echo "已复制依赖 DLL：${name}（${path}）"
                fi
              done
              # 兜底：直接在 OpenSSL 常见安装目录中查找
              for dll in libcrypto-3-x64.dll libssl-3-x64.dll; do
                if [ ! -f "./bin/$dll" ]; then
                  src=$(find "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64" \
                             "/c/Program Files/OpenSSL-v3-Win64" "/c/ProgramData/chocolatey/lib" \
                             -maxdepth 5 -iname "$dll" 2>/dev/null | head -n 1)
                  if [ -n "$src" ]; then
                    cp "$src" ./bin/ && echo "已复制 ${dll}（${src}）"
                  fi
                fi
              done
              # 校验：缺少 OpenSSL DLL 则失败，避免发布残缺产物
              for dll in libcrypto-3-x64.dll libssl-3-x64.dll; do
                if [ ! -f "./bin/$dll" ]; then
                  echo "错误：bin 下缺少 ${dll}（OpenSSL 运行库），产物不完整"
                  exit 1
                fi
              done
              ARTIFACT="aseprite-${VERSION}-windows-x64.zip"
              # -tzip 指定 zip 格式（7z 默认是 7z 格式）
              7z a -tzip "$ARTIFACT" ./bin/*
              ;;
            macos-latest)
              # 将非系统 dylib 依赖（如 homebrew 的 libcrypto.3.dylib/libssl.3.dylib）
              # 复制到 bin 内，改写引用为 @executable_path 并重新签名
              deps=$(otool -L ./bin/aseprite 2>/dev/null | awk 'NR>1{print $1}' \
                       | grep -vE '^/usr/lib/|^/System/|^@' || true)
              for d in $deps; do
                [ -f "$d" ] || continue
                name=$(basename "$d")
                cp -f "$d" ./bin/
                install_name_tool -change "$d" "@executable_path/${name}" ./bin/aseprite
                # 被复制 dylib 自身的依赖（如 libssl 依赖 libcrypto）也一并改写
                sub=$(otool -L "./bin/${name}" 2>/dev/null | awk 'NR>1{print $1}' \
                        | grep -vE '^/usr/lib/|^/System/|^@' || true)
                for s in $sub; do
                  [ -f "$s" ] || continue
                  sname=$(basename "$s")
                  if [ -f "./bin/${sname}" ]; then
                    install_name_tool -change "$s" "@executable_path/${sname}" "./bin/${name}" || true
                  fi
                done
                echo "已内置 ${name}（${d}）"
              done
              codesign --force --sign - ./bin/aseprite 2>/dev/null || true
              ARTIFACT="aseprite-${VERSION}-macos-arm64.zip"
              cd bin && zip -qr "../${ARTIFACT}" . && cd ..
              ;;
            ubuntu-latest)
              ARTIFACT="aseprite-${VERSION}-linux-x64.tar.gz"
              tar -czf "$ARTIFACT" -C bin .
              ;;
          esac
          echo "产物：${ARTIFACT}"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: 上传构建产物（Artifact 备份）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: build/${{ env.artifact_name }}
          if-no-files-found: error

      # -----------------------------------------------------------------
      # 发布 Draft Release（并发安全）
      #  - 已存在的草稿不删除，产物用 --clobber 覆盖上传（始终为最新构建）；
      #  - 同一版本的三个平台任务并发运行时互不干扰；
      #  - 仅当同名 Release 已被发布为正式版时，先删除（含 tag）再重建为草稿。
      # -----------------------------------------------------------------
      - name: 发布 Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          ARTIFACT: ${{ env.artifact_name }}
        run: |
          set -euo pipefail
          # 若同名 release 已存在且为正式发布（非草稿），先删除再重建为草稿
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            is_draft=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "已存在正式 release：${VERSION}，删除后重建为草稿"
              gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || {
                echo "gh release delete 失败，尝试手动删除 tag"
                git push --delete "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION" || true
              }
            fi
          fi
          # 若草稿不存在则创建（并发下可能已被兄弟任务创建，失败可容忍）
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Aseprite ${VERSION} (Auto Build)" \
              --draft \
              --notes "自动构建于 $(date -u)" \
              || echo "release ${VERSION} 创建失败（可能已被并行任务创建），继续上传"
          fi
          # 等待 release 可见（API 最终一致性）
          for i in $(seq 1 12); do
            gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 5
          done
          # 上传产物（--clobber 覆盖同名旧产物；带重试，缓解瞬时 403/限流）
          for attempt in 1 2 3; do
            if gh release upload "$VERSION" "build/${ARTIFACT}" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "已上传产物到 Draft Release：${VERSION}（${ARTIFACT}）"
              exit 0
            fi
            echo "上传失败（第 ${attempt} 次），10 秒后重试"
            sleep 10
          done
          echo "产物上传最终失败：${ARTIFACT}"
          exit 1
